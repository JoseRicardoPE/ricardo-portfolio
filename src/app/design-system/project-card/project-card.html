<article 
    class="project-card"
    [class.project-card--no-shadow]="!shadow()"
>
    <div class="project-card__image-container">
        <img
            class="project-card__image"
            [src]="imageSrc()"
            [alt]="imageAlt()"
        />
    </div>
    <div class="project-card__content">
        <div class="project-card__info">
            <div class="project-card__info-wrapper">
                <span class="project-card__category">{{ category() }}</span>
                <h3 class="project-card__title">{{ title() }}</h3>
                <p class="project-card__description">{{ description() }}</p>
            </div>
            <div class="project-card__technologies">
                @for (technology of technologies(); track technology) {
                    <app-tag
                        size="sm"
                    >
                        {{ technology }}
                    </app-tag>
                }
            </div>
        </div>
        <div class="project-card__actions">
            <app-text-link [href]="projectUrl()">{{ 'common.viewProjects' | translate}}</app-text-link>
        </div>
    </div>
</article>

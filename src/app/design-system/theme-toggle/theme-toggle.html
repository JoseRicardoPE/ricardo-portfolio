<button
    class="theme-toggle"
    type="button"
    [attr.aria-label]="(theme() === 'light' ? 'theme.activateDark' : 'theme.activateLight') | translate"
    (click)="toggleTheme()"
>
    @if (theme() === 'light') {
        <app-icon
            name="moon"
            size="lg"
        ></app-icon>
    } @else {
        <app-icon
            name="sun"
            size="lg"
        ></app-icon>
    }
</button>

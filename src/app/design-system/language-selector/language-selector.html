<div 
    class="language-selector"
    [attr.aria-label]="'common.languageSelector' | translate"
    role="group"   
>
    <button
        type="button"
        class="language-selector__option"
        [class.language-selector__option--active]="language() === 'es'"
        [attr.aria-pressed]="language() === 'es'"
        (click)="selectLanguage('es')"
        [attr.aria-label]="'common.spanish' | translate"
    >
        ES
    </button>
    <button
        type="button"
        class="language-selector__option"
        [class.language-selector__option--active]="language() === 'en'"
        [attr.aria-pressed]="language() === 'en'"
        (click)="selectLanguage('en')"
        [attr.aria-label]="'common.english' | translate"
    >
        EN
    </button>
</div>

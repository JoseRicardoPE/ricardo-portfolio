<section
    class="professional-strengths"
    aria-labelledby="professional-strengths-title"
>
    <h2
        id="professional-strengths-title"
        class="professional-strengths__title"
    >
        {{ title() }}
    </h2>
    <div class="professional-strengths__stack">
        @for (strength of strengths(); track strength._id) {
            <app-tag>{{ strength.name[language()] }}</app-tag>
        }
    </div>
</section>

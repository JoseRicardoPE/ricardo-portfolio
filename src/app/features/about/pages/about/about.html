<app-hero
    imageSrc="/images/about/hero-about-me.png"
    [imageAlt]="'about.hero.imageAlt' | translate"
    [eyebrow]="'about.hero.eyebrow' | translate"
    [heading]="'about.hero.heading' | translate"
    [description]="'about.hero.description' | translate"
>
</app-hero>
<app-professional-profile
    [title]="'about.profile.title' | translate"
    [paragraphs]="'about.profile.description' | translate"
></app-professional-profile>
<app-my-cv
    imageSrc="/images/cv/cv.png"
    [title]="'about.myCv.title' | translate"
    [heading]="'about.myCv.heading' | translate"
    [description]="'about.myCv.description' | translate"
    [imageAlt]="'about.myCv.imageAlt' | translate"
>
    <app-button-link
        cv-actions
        href="/cv_Ricardo/FrontendDeveloper_RicardoPacheco.pdf"
        [external]="true"
        download="Ricardo_Pacheco_CV.pdf"
        [fullWidth]="true"
    >
        {{ 'about.myCv.downloadLabel' | translate }}
    </app-button-link>
    <app-button-link
        cv-actions
        href="https://fullstackricardo.com/"
        variant="secondary"
        [external]="true"
        [fullWidth]="true"
    >
        {{ 'about.myCv.onlineLabel' | translate }}
    </app-button-link>
</app-my-cv>
<app-about-technologies
    [title]="'about.technologies.title' | translate"
    [technologies]="technologies()"
></app-about-technologies>

<section
    class="professional-profile"
    aria-labelledby="professional-profile-title"
>
    <h2 class="professional-profile__title">
        {{ title() }}
    </h2>
    <div class="professional-profile__description">
        @for (paragraph of paragraphs(); track $index) {
            @if ($index <= activeParagraph()) {
                <p
                    class="professional-profile__paragraph"
                    [class.professional-profile__paragraph--typing]="$index === activeParagraph()"
                    [appTypewriter]="paragraph"
                    [speed]="50"
                    (typingCompleted)="onTypingCompleted($index)"
                >
                    {{ paragraph }}
                </p>
            }
        }
    </div>
</section>

<section
    class="contact-cta"
    aria-labelledby="contact-cta-title"
>
    <h2
        id="contact-cta-title"
        class="contact-cta__title"
    >
        {{ title() }}
    </h2>
    <p class="contact-cta__message">
        {{ message() }}
    </p>
    <div class="contact-cta__actions">
        <ng-content select="[contact-actions]"></ng-content>
    </div>
</section>

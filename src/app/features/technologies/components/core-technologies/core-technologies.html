<section
    class="core-technologies"
    aria-labelledby="core-technologies-title"
>
    <h2
        id="core-technologies-title"
        class="core-technologies__title"
    >
        {{ title() }}
    </h2>
    <div class="core-technologies__list">
        @for (technology of technologies(); track technology._id) {
            <app-tag>{{ technology.name }}</app-tag>
        }
    </div>
</section>

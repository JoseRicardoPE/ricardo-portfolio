<header class="header">
    <div 
        class="header__top"
    >
        <a 
            class="header__brand"
            routerLink="/"
            [attr.aria-label]="'header.homeAriaLabel' | translate"
            (click)="closeMenu()"
        >
            <img
                class="header__logo"
                src="images/isotipoPortfolio.webp" 
                alt="isotipo Portfolio Ricardo"
            >
        </a>

        <!-- Desktop -->
         <div class="header__desktop-content">
            <nav
                class="header__desktop-navigation"
                [attr.aria-label]="'header.mainNavigation' | translate"
            >
                <app-nav-item
                    [label]="'navigation.home' | translate"
                    route="/"
                ></app-nav-item>
                <app-nav-item
                    [label]="'navigation.about' | translate"
                    route="/about"
                >
                </app-nav-item>
                <app-nav-item
                    [label]="'navigation.projects' | translate"
                    route="/projects"
                >
                </app-nav-item>
                <app-nav-item
                    [label]="'navigation.contact' | translate"
                    route="/contact"
                >
                </app-nav-item>
            </nav>
            <div class="header__desktop-actions">
                <app-language-selector></app-language-selector>
                <app-theme-toggle></app-theme-toggle>
            </div>
         </div>

        <!-- Mobile -->
        <button 
            class="header__menu-button"
            type="button"
            [attr.aria-expanded]="isMenuOpen()"
            aria-controls="mobile-menu"
            [attr.aria-label]="(isMenuOpen() ? 'header.closeMenu' : 'header.openMenu' | translate)"
            (click)="toggleMenu()"
        >
            @if (isMenuOpen()) {
                <app-icon
                    name="close"
                    size="lg"
                >
                </app-icon>
            } @else {
                <app-icon
                    name="open"
                    size="lg"
                >
                </app-icon>
            }
        </button>
    </div>
    @if (isMenuOpen()) {
        <div
            class="header__mobile-menu"
            id="mobile-menu"
        >
            <nav
                class="header__mobile-navigation"
                [attr.aria-label]="'header.mainNavigation' | translate"
                (click)="closeMenu()"
            >
                <app-nav-item
                    [label]="'navigation.home' | translate"
                    route="/"
                >
                </app-nav-item>
                <app-nav-item
                    [label]="'navigation.about' | translate"
                    route="/about"
                >
                </app-nav-item>
                <app-nav-item
                    [label]="'navigation.projects' | translate"
                    route="/projects"
                >
                </app-nav-item>
                <app-nav-item
                    [label]="'navigation.contact' | translate"
                    route="/contact"
                >
                </app-nav-item>
            </nav>
            <div class="header__mobile-actions">
                <app-language-selector></app-language-selector>
                <app-theme-toggle></app-theme-toggle>
            </div>
        </div>
    }
</header>

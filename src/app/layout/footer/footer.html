<footer class="footer">
    <div class="footer__content">
        <div class="footer__brand">
            <span class="footer__name">Ricardo Pacheco</span>
            <span class="footer__role">Frontend Engineer</span>
        </div>
        <nav class="footer__navigation">
            <app-nav-item
                [label]="'footer.navigation.home' | translate"
                route="/"
            ></app-nav-item>
            <app-nav-item
                [label]="'footer.navigation.about'| translate"
                route="/about"
            ></app-nav-item>
            <app-nav-item
                [label]="'footer.navigation.projects'| translate"
                route="/projects"
            ></app-nav-item>
            <app-nav-item
                [label]="'footer.navigation.contact'| translate"
                route="/contact"
            ></app-nav-item>
        </nav>
        <div class="footer__social-links">
            <a 
                class="footer__social-link"    
                href="https://github.com/JoseRicardoPE"
                target="_blank"
                rel="noopener noreferrer"
                [attr.aria-label]="'footer.github.arialabel' | translate"
            >
                <app-icon
                    name="github"
                    size="lg"
                ></app-icon>
            </a>
            <a
                class="footer__social-link"
                href="https://linkedin.com/in/ricardo-pacheco-escobar"
                target="_blank"
                rel="noopener noreferrer"
                [attr.aria-label]="'footer.linkedin.arialabel' | translate"
            >
                <app-icon
                    name="linkedin"
                    size="lg"
                ></app-icon>
            </a>
        </div>
    </div>
    <div class="footer__bottom">
        <span>© 2026 Ricardo Pacheco</span>
    </div>
</footer>
